name: tiktap
description: TikTap - aplikasi pemesanan tiket bioskop (mobile & web).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  barcode_widget: ^2.0.4
  http: ^1.2.2
  shared_preferences: ^2.3.2
  crypto: ^3.0.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.3
  supabase_flutter: ^2.18.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/posters/
